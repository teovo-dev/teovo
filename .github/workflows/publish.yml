name: Publish to npm
# Push a version tag (e.g. v0.2.0) whose number matches every package's version. npm trusts this workflow through
# trusted publishing (OIDC): there is no npm token anywhere. Each package's trusted publisher on npmjs.com names this
# repository and this file (publish.yml). See RELEASING.md.
on:
  push: { tags: ['v*'] }
permissions:
  contents: read
  id-token: write   # trusted publishing: GitHub gives npm a short-lived proof that this workflow is publishing
jobs:
  publish:
    runs-on: ubuntu-latest   # trusted publishing needs GitHub-hosted runners
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: teovo, POSTGRES_DB: teovo_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEOVO_TEST_DATABASE_URL: postgres://postgres:teovo@127.0.0.1:5432/teovo_test
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11 (trusted publishing needs npm 11.5.1+). No cache in a release build.
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - name: The tag matches every package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in server react db cli; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v, the tag is $tag"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test
      # Staged: each package waits on npmjs.com until a maintainer approves it with 2FA, then it goes public.
      # In order, because db needs server and the CLI needs db. Provenance is added automatically.
      - run: |
          for p in server db react cli; do npm stage publish -w packages/$p; done
