<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teovo example shop</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #111827; background: #fafaf9; }
      .bar { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fff; }
      .bar select { margin-left: auto; }
      main { padding: 16px; max-width: 760px; overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; background: #fff; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
      .sheet-tabs { display: flex; gap: 4px; padding: 8px 48px 0 12px; }
      .sheet-tabs button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; color: inherit; }
      .sheet-tabs button[aria-pressed='true'] { background: #fef3c7; color: #111827; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
